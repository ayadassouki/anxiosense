# AnxioSense LLM Experiments — Configuration
# Paths are relative to the repository root (anxiosense/).

datasets:
  dreaddit:
    # Canonical processed file — generated by evaluation/datasets/scripts/preprocess_datasets.py
    # Verified by evaluation/datasets/scripts/verify_preprocessing.py
    # 1530 rows (1 malformed row excluded: id=559 '#NAME?' Excel error).
    # 3 intra-train duplicate texts FLAGGED (is_intra_split_duplicate=True), NOT removed.
    # 6 cross-split overlaps FLAGGED (is_cross_split_duplicate=True), NOT removed.
    # Original (DO NOT MODIFY): evaluation/datasets/dreaddit/dreaddit_anxiety_subset.csv
    path: "evaluation/datasets/processed/dreaddit_clean.csv"
    text_column: "text_redacted"   # Redacted version sent to API; raw text preserved in 'text' column
    label_column: "label"
    split_column: "split"
    task_type: "binary"
    format: "csv"
    description: >
      Preprocessed Dreaddit anxiety subset. Binary stress label (0=no stress, 1=stress).
      1530 rows: train=1206, test=324. Label dist: 68.7% stressed.
      Duplicate and cross-split-overlap rows are flagged, not removed.
      See evaluation/datasets/DATA_PREPROCESSING.md for full methodology.

  goemotions:
    # Canonical processed file — generated by evaluation/datasets/scripts/preprocess_datasets.py
    # Verified by evaluation/datasets/scripts/verify_preprocessing.py
    # 26268 rows (1 malformed row excluded: id=efh341y '#ERROR!' Excel error).
    # 54 intra-split duplicate texts FLAGGED (is_intra_split_duplicate=True), NOT removed.
    # 46 cross-split overlaps FLAGGED (is_cross_split_duplicate=True), NOT removed.
    # Original (DO NOT MODIFY): evaluation/datasets/goemotions/goemotions_anxiosense_single.csv
    path: "evaluation/datasets/processed/goemotions_clean.csv"
    text_column: "text_redacted"   # Redacted version sent to API; raw text preserved in 'text' column
    label_column: "emotion_names"
    split_column: "split"
    task_type: "multiclass"
    format: "csv"
    description: >
      Preprocessed AnxioSense-filtered GoEmotions subset. 26,268 rows
      (train=21,062  val=2,579  test=2,627).
      emotion_names: one of anger, annoyance, disappointment, fear, grief, joy,
      nervousness, neutral, relief, sadness — stored as string "['nervousness']".
      Mapped to 5-class eval space: anxiety, fear, sadness, frustration, non_distress.
      See evaluation/datasets/DATA_PREPROCESSING.md for full methodology.

prompts_dir: "prompts"
primary_agent: "emotion"

models:
  # FROZEN DECODING PARAMETERS (2026-08-03) — temperature 0.0, max_tokens 4096 for
  # every model and every prompting strategy. These are enforced in
  # src/mastra/utils/model-provider.ts (DECODING_TEMPERATURE / DECODING_MAX_TOKENS)
  # and must be kept identical to the values below; the runner copies these into each
  # cell's *_meta.json, so a drift between the two makes the recorded methodology wrong.
  #
  # Rationale:
  #   temperature 0.0 — previously unset, so the provider default (1.0) applied and was
  #     never recorded. Temperature is not comparable across model families, so 0 is the
  #     only value that means the same thing for all five models. Trade-off: between-run
  #     variance now reflects provider nondeterminism, not sampling.
  #   max_tokens 4096 — uniform across models and strategies. Well above the longest
  #     observed output; a binding cap truncates the longest outputs first, which are the
  #     CoT strategies, biasing the comparison the study is making. Previously these
  #     differed per model (16384/32768/65536) and were never sent to the API at all.
  # NOTE: :free models share rate-limited upstream pools (confirmed exhausted in smoke tests).
  # For reliable experiments use paid routing (drop :free suffix) or Mistral direct API.
  - id: "meta-llama/llama-4-scout"
    name: "Llama 4 Scout (paid)"
    provider: "openrouter"
    temperature: 0.0
    max_tokens: 4096
    seed: null

  - id: "mistral-small-2603"
    name: "Mistral Small 4"
    provider: "mistral"
    temperature: 0.0
    max_tokens: 4096
    seed: null

  - id: "google/gemma-3-27b-it:free"
    name: "Gemma 3 27B IT"
    provider: "openrouter"
    temperature: 0.0
    max_tokens: 4096
    seed: null

  - id: "deepseek/deepseek-v4-flash"
    name: "DeepSeek V4 Flash"
    provider: "openrouter"
    temperature: 0.0
    max_tokens: 4096
    seed: null

  - id: "microsoft/phi-4:free"
    name: "Phi-4"
    provider: "openrouter"
    temperature: 0.0
    max_tokens: 4096
    seed: null

strategies:
  - zero-shot
  - zero-shot-cot
  - one-shot-cot

runs: 5
sample_size: 715
output_dir: "evaluation/llm-experiments/outputs"
log_dir: "evaluation/llm-experiments/logs"

retry:
  max_attempts: 3
  backoff_base: 2
  timeout_seconds: 30

# ── AnxioSense server connection ──────────────────────────────────────────────
# The evaluation pipeline calls the full AnxioSense Express server, which
# internally calls the Mastra workflow on port 4111.
#
# base_url          : URL of the AnxioSense Express server.
#                     Local dev:   http://localhost:3001
#                     Railway:     https://<your-app>.up.railway.app
# evaluate_endpoint : Path for the evaluation API (added in Phase 3A).
# request_delay_seconds : Seconds to wait between API calls (avoids overload).
# timeout_seconds   : Per-request timeout.
#
# Model switching note:
#   The model used by the pipeline is configured via MODEL_PROVIDER + MODEL_ID in
#   anxiosense/.env (Mastra) and server/.env (Express metadata) — both must match.
#   Restart both Mastra (npm run dev in anxiosense/) and Express (npm run dev in server/)
#   after changing env vars. The model_id values below are recorded in result metadata.
#
server:
  base_url: "http://localhost:3001"
  evaluate_endpoint: "/api/workflow/evaluate"
  request_delay_seconds: 1.0
  timeout_seconds: 90
