# AnxioSense LLM Experiments — Configuration
# Paths are relative to the repository root (anxiosense/).

datasets:
  dreaddit:
    # Canonical processed file — generated by evaluation/datasets/scripts/preprocess_datasets.py
    # Verified by evaluation/datasets/scripts/verify_preprocessing.py
    # 1530 rows (1 malformed row excluded: id=559 '#NAME?' Excel error).
    # 3 intra-train duplicate texts FLAGGED (is_intra_split_duplicate=True), NOT removed.
    # 6 cross-split overlaps FLAGGED (is_cross_split_duplicate=True), NOT removed.
    # Original (DO NOT MODIFY): evaluation/datasets/dreaddit/dreaddit_anxiety_subset.csv
    path: "evaluation/datasets/processed/dreaddit_clean.csv"
    text_column: "text_redacted"   # Redacted version sent to API; raw text preserved in 'text' column
    label_column: "label"
    split_column: "split"
    task_type: "binary"
    format: "csv"
    description: >
      Preprocessed Dreaddit anxiety subset. Binary stress label (0=no stress, 1=stress).
      1530 rows: train=1206, test=324. Label dist: 68.7% stressed.
      Duplicate and cross-split-overlap rows are flagged, not removed.
      See evaluation/datasets/DATA_PREPROCESSING.md for full methodology.

  goemotions:
    # Canonical processed file — generated by evaluation/datasets/scripts/preprocess_datasets.py
    # Verified by evaluation/datasets/scripts/verify_preprocessing.py
    # 26268 rows (1 malformed row excluded: id=efh341y '#ERROR!' Excel error).
    # 54 intra-split duplicate texts FLAGGED (is_intra_split_duplicate=True), NOT removed.
    # 46 cross-split overlaps FLAGGED (is_cross_split_duplicate=True), NOT removed.
    # Original (DO NOT MODIFY): evaluation/datasets/goemotions/goemotions_anxiosense_single.csv
    path: "evaluation/datasets/processed/goemotions_clean.csv"
    text_column: "text_redacted"   # Redacted version sent to API; raw text preserved in 'text' column
    label_column: "emotion_names"
    split_column: "split"
    task_type: "multiclass"
    format: "csv"
    description: >
      Preprocessed AnxioSense-filtered GoEmotions subset. 26,268 rows
      (train=21,062  val=2,579  test=2,627).
      emotion_names: one of anger, annoyance, disappointment, fear, grief, joy,
      nervousness, neutral, relief, sadness — stored as string "['nervousness']".
      Mapped to 5-class eval space: anxiety, fear, sadness, frustration, non_distress.
      See evaluation/datasets/DATA_PREPROCESSING.md for full methodology.

prompts_dir: "prompts"
primary_agent: "emotion"

models:
  # ── DECODING: PROVIDER DEFAULTS (2026-08-04) ────────────────────────────────
  # Approved methodology: each model uses its OWN default settings.
  # temperature / max_tokens / seed are therefore null here and are NOT SENT to
  # the API at all — src/mastra/utils/model-provider.ts strips them from every
  # outgoing request body. "null" below means "omitted", not "sent as null".
  #
  # This SUPERSEDES the 2026-08-03 freeze at temperature 0.0 / max_tokens 4096.
  # Data collected under that freeze is preserved unmodified in
  # outputs/stage_c_v2/ and remains valid as a temperature-0 dataset. Do not mix
  # the two in one output directory; audit_pilot.py fails a run that does.
  #
  # Only ONE of the five publishes a numeric default: Gemma 4 31B
  # (temperature 1, top_p 0.95, top_k 64), per `default_parameters` in the
  # OpenRouter catalogue snapshot sha256 8950a2285eef034e… retrieved 2026-08-04.
  # The other four publish nothing; their applied temperature is unobservable and
  # is recorded as "unknown / provider default applied".
  #
  # ── UPSTREAM PIN ────────────────────────────────────────────────────────────
  # pin_provider fixes ONE upstream inference provider per model, verified with
  # GET /api/v1/models/{id}/endpoints on 2026-08-04 (scripts/query_endpoints.py).
  # Enforced as {"provider":{"order":[pin],"allow_fallbacks":false}}.
  #
  # Purpose: hold quantisation and sampling implementation constant WITHIN a
  # model. It does NOT standardise across models — no single provider serves all
  # five, so quantisation still differs BETWEEN models (fp8 / fp4 / bf16). That
  # is a disclosed limitation, not a controlled variable.
  #
  # pin_quantization adds `quantizations:[...]` to the routing directive. It is set
  # ONLY where the pinned provider exposes more than one endpoint: google/gemma-4-31b-it
  # is served by TWO DeepInfra endpoints (fp4 and fp8) and `upstream_provider` reads
  # "DeepInfra" for both, so a switch mid-run would otherwise be invisible.
  # Resolved 2026-08-04: pinned to fp4. With allow_fallbacks:false an unavailable
  # precision now ERRORS rather than being silently served at fp8.
  #
  # NOTE: pin_quantization is a REQUEST DIRECTIVE, not an observed value — the
  # OpenRouter chat response carries `provider` but never `quantization`. It is
  # enforced by hard failure, not by measurement. `observed_quantization` below is
  # what the endpoints survey reported on 2026-08-04, recorded for the write-up.
  #
  # All five run through OpenRouter, so no MISTRAL_API_KEY is required.
  - id: "meta-llama/llama-4-scout"
    name: "Llama 4 Scout"
    provider: "openrouter"
    pin_provider: "DeepInfra"      # fp8   ctx 327680    uptime 99.8%
    pin_quantization: null
    observed_quantization: "fp8"
    temperature: null              # omitted from the request
    max_tokens: null               # omitted from the request
    seed: null                     # omitted from the request

  - id: "mistralai/mistral-small-2603"
    name: "Mistral Small 4"
    provider: "openrouter"
    pin_provider: "Mistral"        # ctx 262144   uptime 100.0%
    pin_quantization: null
    observed_quantization: "not published"
    temperature: null
    max_tokens: null
    seed: null

  - id: "google/gemma-4-31b-it"
    name: "Gemma 4 31B IT"
    provider: "openrouter"
    pin_provider: "DeepInfra"      # fp4   ctx 262144    uptime 99.9%  (see CAVEAT)
    pin_quantization: "fp4"
    observed_quantization: "fp4 (TWO endpoints: fp4, fp8 — filtered to fp4)"
    temperature: null
    max_tokens: null
    seed: null

  # EXCLUDED 2026-08-09: DeepSeek removed from the evaluated panel (persistent pinned-endpoint
  # infrastructure failure — Aug 5: 84x HTTP 504; Aug 9: sustained OpenRouter 429 engine_overloaded,
  # upstream_provider_shared_pool). Block kept for run-1 provenance; run-1 data reported in appendix only.
  - id: "deepseek/deepseek-v4-flash"
    name: "DeepSeek V4 Flash"
    provider: "openrouter"
    pin_provider: "DeepInfra"      # fp4   ctx 1048576   uptime 99.7%
    pin_quantization: null
    observed_quantization: "fp4"
    temperature: null
    max_tokens: null
    seed: null

  - id: "microsoft/phi-4"
    name: "Phi-4"
    provider: "openrouter"
    pin_provider: "DeepInfra"      # bf16  ctx 16384     uptime 100.0%  sole provider
    pin_quantization: null
    observed_quantization: "bf16"
    temperature: null
    max_tokens: null
    seed: null

  - id: "qwen/qwen3.5-27b"
    name: "Qwen 3.5 27B"
    provider: "openrouter"
    pin_provider: "Alibaba"        # fp8   ctx 262144   uptime 99.9% (30m, verified 2026-08-09)
    pin_quantization: null         # sole Alibaba endpoint on 2026-08-09 — re-check with query_endpoints.py
    observed_quantization: "fp8"
    temperature: null              # omitted; Alibaba published defaults: T 0.6, top_p 0.95, top_k 20
    # DEVIATION 2026-08-09: request carries reasoning:{enabled:false} (MODEL_REQUEST_OVERRIDES in
    # model-provider.ts). Alibaba's served default produced ~30k output tokens/assessment; the toggle
    # restores the catalogue-documented reasoning-off default. Not a sampling parameter.
    max_tokens: null
    seed: null

strategies:
  - zero-shot
  - zero-shot-cot
  - one-shot-cot

runs: 5
sample_size: 715
output_dir: "evaluation/llm-experiments/outputs"
log_dir: "evaluation/llm-experiments/logs"

retry:
  max_attempts: 3
  backoff_base: 2
  timeout_seconds: 30

# ── AnxioSense server connection ──────────────────────────────────────────────
# The evaluation pipeline calls the full AnxioSense Express server, which
# internally calls the Mastra workflow on port 4111.
#
# base_url          : URL of the AnxioSense Express server.
#                     Local dev:   http://localhost:3001
#                     Railway:     https://<your-app>.up.railway.app
# evaluate_endpoint : Path for the evaluation API (added in Phase 3A).
# request_delay_seconds : Seconds to wait between API calls (avoids overload).
# timeout_seconds   : Per-request timeout.
#
# Model switching note:
#   The model used by the pipeline is configured via MODEL_PROVIDER + MODEL_ID in
#   anxiosense/.env (Mastra) and server/.env (Express metadata) — both must match.
#   Restart both Mastra (npm run dev in anxiosense/) and Express (npm run dev in server/)
#   after changing env vars. The model_id values below are recorded in result metadata.
#
server:
  base_url: "http://localhost:3001"
  evaluate_endpoint: "/api/workflow/evaluate"
  request_delay_seconds: 1.0
  timeout_seconds: 90
