# AnxioSense publication experiment — EXAMPLE configuration.
#
# This file is a TEMPLATE, not the approved publication configuration.
# The dataset manifests referenced below are CANDIDATES generated from the data
# currently on disk. The final scope is pending supervisor approval.

# run_class is DECLARED, never inferred from the experiment_id, the config path,
# or a CLI flag. One of: publication | benchmark | smoke | mock.
# Omitting it means "benchmark", and a config that omits it hashes exactly as it
# did before run_class existed.
#
#   publication -> server.mastra_poll_interval_ms MUST be declared, and preflight
#                  verifies it against GET /api/health, aborting before dispatch
#                  on a missing, invalid, unreachable or mismatched value.
run_class: benchmark

experiment_id: "example_mock_run"
output_root: "evaluation/publication_experiments/runs"

# Every model must state `enabled` explicitly. There is no default: a model
# cannot be disabled by a comment, and cannot be enabled by omission.
models:
  - id: "meta-llama/llama-4-scout"
    name: "Llama 4 Scout"
    provider: "openrouter"
    pin_provider: "DeepInfra"
    enabled: true
  - id: "mistralai/mistral-small-2603"
    name: "Mistral Small 4"
    provider: "openrouter"
    pin_provider: "Mistral"
    enabled: true
  - id: "google/gemma-4-31b-it"
    name: "Gemma 4 31B IT"
    provider: "openrouter"
    pin_provider: "DeepInfra"
    pin_quantization: "fp4"
    enabled: true
  - id: "microsoft/phi-4"
    name: "Phi-4"
    provider: "openrouter"
    pin_provider: "DeepInfra"
    enabled: true
  - id: "qwen/qwen3.5-27b"
    name: "Qwen 3.5 27B"
    provider: "openrouter"
    pin_provider: "Alibaba"
    enabled: true
  # Excluded from the publication panel. `enabled: false` is ENFORCED in code
  # (config.ExperimentConfig.enabled_models); this is not a comment.
  - id: "deepseek/deepseek-v4-flash"
    name: "DeepSeek V4 Flash"
    provider: "openrouter"
    pin_provider: "DeepInfra"
    enabled: false

strategies: ["zero-shot", "zero-shot-cot", "one-shot-cot"]

datasets:
  - name: "dreaddit"
    manifest: "evaluation/publication_experiments/manifests/candidate_dreaddit_test.json"
  - name: "goemotions"
    manifest: "evaluation/publication_experiments/manifests/candidate_goemotions_test.json"

runs: 5
run_start: 1

retry:
  # Deterministic and bounded. Applies ONLY to transport failures
  # (429, 5xx, connection, timeout). A completed model response is never retried.
  max_attempts: 3
  backoff_base_ms: 2000
  backoff_factor: 2
  backoff_cap_ms: 30000

server:
  base_url: "http://localhost:3001"
  evaluate_endpoint: "/api/workflow/evaluate"
  # Must exceed the server's own poll budget or the client abandons runs that are
  # still executing and still being billed. Validated at config load.
  timeout_seconds: 180
  server_poll_budget_seconds: 150
  # REQUIRED FOR PUBLICATION RUNS. The Mastra poll cadence this experiment
  # expects the server to be running, in milliseconds. Preflight reads the
  # EFFECTIVE value from GET /api/health and ABORTS if it cannot be obtained or
  # does not match, so the cadence that produced this run's latency figures is
  # recorded in the run record rather than being an unrecorded property of the
  # shell that started the server.
  #
  # The server reads MASTRA_POLL_INTERVAL_MS (server/src/routes/workflow.ts,
  # pollRun); its default is 3000. Start Express to match:
  #     cd server && MASTRA_POLL_INTERVAL_MS=250 npm run dev
  #
  # Omit this key and the probe becomes best-effort: the value is recorded when
  # available and null otherwise, and nothing aborts. Every config written
  # before 2026-09-04 omits it, which is why their config_sha256 is unchanged.
  mastra_poll_interval_ms: 3000   # REQUIRED when run_class is "publication"
  request_delay_seconds: 0.0
