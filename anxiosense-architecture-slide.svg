<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" width="1280" height="720" role="img">
  <title>AnxioSense Pipeline Architecture — Slide</title>

  <!-- Background -->
  <rect width="1280" height="720" fill="#0F172A"/>

  <!-- Subtle grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1280" height="720" fill="url(#grid)" opacity="0.6"/>

  <!-- TITLE -->
  <text x="640" y="52" text-anchor="middle" font-size="28" font-weight="700" fill="#F8FAFC" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Pipeline Architecture</text>
  <text x="640" y="76" text-anchor="middle" font-size="14" fill="#64748B" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Multi-agent · Retrieval-assisted · 100% local  (Mistral 7B via Ollama)</text>

  <!-- COL 1: INPUT -->
  <text x="110" y="112" text-anchor="middle" font-size="10" font-weight="700" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" letter-spacing="0.1em">INPUT</text>

  <rect x="28" y="122" width="164" height="70" rx="8" fill="#1E3A5F" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="110" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#93C5FD" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Free-text entry</text>
  <text x="110" y="164" text-anchor="middle" font-size="11" fill="#64748B" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Open narrative</text>
  <text x="110" y="179" text-anchor="middle" font-size="11" fill="#64748B" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">journal input</text>

  <text x="110" y="210" text-anchor="middle" font-size="20" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">+</text>

  <rect x="28" y="220" width="164" height="86" rx="8" fill="#1C3A2A" stroke="#10B981" stroke-width="1.5"/>
  <text x="110" y="244" text-anchor="middle" font-size="13" font-weight="700" fill="#6EE7B7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">GAD-7  (optional)</text>
  <text x="110" y="261" text-anchor="middle" font-size="11" fill="#64748B" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">7 items × 0–3</text>
  <rect x="46" y="270" width="128" height="20" rx="4" fill="#064E3B"/>
  <text x="110" y="283" text-anchor="middle" font-size="10" font-weight="700" fill="#34D399" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Deterministic · no LLM</text>
  <text x="110" y="298" text-anchor="middle" font-size="10" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Scored in TypeScript</text>

  <line x1="192" y1="230" x2="240" y2="230" stroke="#334155" stroke-width="2"/>
  <polygon points="236,224 248,230 236,236" fill="#334155"/>
  <line x1="192" y1="157" x2="228" y2="157" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="228" y1="157" x2="228" y2="230" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- COL 2: PARALLEL AGENTS -->
  <text x="378" y="112" text-anchor="middle" font-size="10" font-weight="700" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" letter-spacing="0.1em">PARALLEL AGENTS  ·  .parallel()</text>

  <rect x="250" y="122" width="136" height="58" rx="7" fill="#1E293B" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="318" y="144" text-anchor="middle" font-size="12" font-weight="700" fill="#6EE7B7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Emotion agent</text>
  <text x="318" y="160" text-anchor="middle" font-size="10.5" fill="#64748B" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Tone · sentiment · affect</text>
  <text x="318" y="173" text-anchor="middle" font-size="9.5" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">→ EMO-x claims</text>

  <rect x="250" y="196" width="136" height="58" rx="7" fill="#1E293B" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="318" y="218" text-anchor="middle" font-size="12" font-weight="700" fill="#6EE7B7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Symptom agent</text>
  <text x="318" y="234" text-anchor="middle" font-size="10.5" fill="#64748B" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Anxiety symptoms</text>
  <text x="318" y="247" text-anchor="middle" font-size="9.5" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">→ SYM-x claims</text>

  <rect x="250" y="270" width="136" height="58" rx="7" fill="#1E293B" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="318" y="292" text-anchor="middle" font-size="12" font-weight="700" fill="#6EE7B7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Context agent</text>
  <text x="318" y="308" text-anchor="middle" font-size="10.5" fill="#64748B" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Life stressors · context</text>
  <text x="318" y="321" text-anchor="middle" font-size="9.5" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">→ CTX-x claims</text>

  <rect x="250" y="344" width="136" height="58" rx="7" fill="#1E293B" stroke="#FBBF24" stroke-width="1.5"/>
  <text x="318" y="366" text-anchor="middle" font-size="12" font-weight="700" fill="#FDE68A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Referral agent</text>
  <text x="318" y="382" text-anchor="middle" font-size="10.5" fill="#64748B" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Risk-level triage</text>
  <text x="318" y="395" text-anchor="middle" font-size="9.5" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">low · moderate · urgent</text>

  <line x1="386" y1="151" x2="420" y2="151" stroke="#334155" stroke-width="1.2"/>
  <line x1="386" y1="225" x2="420" y2="225" stroke="#334155" stroke-width="1.2"/>
  <line x1="386" y1="299" x2="420" y2="299" stroke="#334155" stroke-width="1.2"/>
  <line x1="386" y1="373" x2="420" y2="373" stroke="#334155" stroke-width="1.2"/>
  <line x1="420" y1="151" x2="420" y2="373" stroke="#334155" stroke-width="1.2"/>
  <line x1="420" y1="262" x2="460" y2="262" stroke="#334155" stroke-width="2"/>
  <polygon points="456,256 468,262 456,268" fill="#334155"/>

  <!-- COL 3: CLAIMS + RETRIEVAL -->
  <text x="578" y="112" text-anchor="middle" font-size="10" font-weight="700" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" letter-spacing="0.1em">CLAIMS  &amp;  RETRIEVAL</text>

  <rect x="468" y="122" width="220" height="56" rx="8" fill="#2D1B69" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="578" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#C4B5FD" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Build Claims Step</text>
  <text x="578" y="163" text-anchor="middle" font-size="10.5" fill="#6B7280" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Normalise · tag sourceAgent · assign sessionId</text>

  <line x1="578" y1="178" x2="578" y2="208" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="572,205 578,216 584,205" fill="#334155"/>

  <rect x="468" y="216" width="220" height="70" rx="8" fill="#1A1A2E" stroke="#F97316" stroke-width="1.5"/>
  <text x="578" y="238" text-anchor="middle" font-size="13" font-weight="700" fill="#FB923C" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Vector KB Retrieval</text>
  <text x="578" y="254" text-anchor="middle" font-size="10.5" fill="#6B7280" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">fastembed  ·  bge-small-en-v1.5</text>
  <text x="578" y="269" text-anchor="middle" font-size="10.5" fill="#6B7280" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">LibSQL vector store  ·  384-dim</text>
  <text x="578" y="280" text-anchor="middle" font-size="9.5" fill="#374151" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">emotions · symptoms · CTX-001→009</text>

  <line x1="578" y1="286" x2="578" y2="314" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="572,311 578,322 584,311" fill="#334155"/>

  <rect x="468" y="322" width="220" height="76" rx="8" fill="#1A1A2E" stroke="#F97316" stroke-width="1.5"/>
  <text x="578" y="342" text-anchor="middle" font-size="12" font-weight="700" fill="#FB923C" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Cosine Similarity</text>
  <rect x="484" y="350" width="188" height="16" rx="3" fill="#052E16"/>
  <text x="578" y="361" text-anchor="middle" font-size="10" font-weight="600" fill="#34D399" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">≥ 0.72  →  supported</text>
  <rect x="484" y="370" width="188" height="16" rx="3" fill="#1C1506"/>
  <text x="578" y="381" text-anchor="middle" font-size="10" font-weight="600" fill="#FCD34D" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">≥ 0.55  →  partial</text>
  <rect x="484" y="390" width="188" height="16" rx="3" fill="#1F0707"/>
  <text x="578" y="401" text-anchor="middle" font-size="10" font-weight="600" fill="#F87171" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">&lt; 0.55  →  dropped</text>

  <line x1="688" y1="300" x2="728" y2="300" stroke="#334155" stroke-width="2"/>
  <polygon points="724,294 736,300 724,306" fill="#334155"/>

  <!-- COL 4: VALIDATION + REPORT -->
  <text x="880" y="112" text-anchor="middle" font-size="10" font-weight="700" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" letter-spacing="0.1em">VALIDATION  &amp;  REPORT</text>

  <rect x="736" y="122" width="288" height="72" rx="8" fill="#1F0707" stroke="#F87171" stroke-width="1.5"/>
  <text x="880" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#FCA5A5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Evidence Validation</text>
  <text x="880" y="163" text-anchor="middle" font-size="10.5" fill="#6B7280" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Removes unsupported claims · checks consistency</text>
  <text x="880" y="179" text-anchor="middle" font-size="10.5" fill="#6B7280" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Invalid risk_level → defaults to "moderate"</text>

  <line x1="880" y1="194" x2="880" y2="222" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="874,219 880,230 886,219" fill="#334155"/>

  <rect x="736" y="230" width="128" height="72" rx="8" fill="#1F0707" stroke="#EF4444" stroke-width="2"/>
  <text x="800" y="252" text-anchor="middle" font-size="11" font-weight="700" fill="#FCA5A5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Urgent override</text>
  <text x="800" y="268" text-anchor="middle" font-size="9.5" fill="#6B7280" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Hardcoded crisis</text>
  <text x="800" y="281" text-anchor="middle" font-size="9.5" fill="#6B7280" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">notice — LLM skipped</text>
  <text x="800" y="294" text-anchor="middle" font-size="9" fill="#EF4444" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">riskLevel = "urgent"</text>

  <rect x="880" y="230" width="144" height="72" rx="8" fill="#0F172A" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="952" y="252" text-anchor="middle" font-size="11" font-weight="700" fill="#93C5FD" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Report agent</text>
  <text x="952" y="268" text-anchor="middle" font-size="9.5" fill="#6B7280" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Mistral 7B · temp 0.1</text>
  <text x="952" y="281" text-anchor="middle" font-size="9.5" fill="#6B7280" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Sections 1–8</text>
  <text x="952" y="294" text-anchor="middle" font-size="9.5" fill="#6B7280" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Non-diagnostic</text>

  <line x1="880" y1="302" x2="880" y2="330" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="874,327 880,338 886,327" fill="#334155"/>

  <rect x="736" y="338" width="288" height="68" rx="8" fill="#1C1506" stroke="#FBBF24" stroke-width="2"/>
  <text x="880" y="360" text-anchor="middle" font-size="12" font-weight="700" fill="#FDE68A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">GAD-7 injection  (TypeScript)</text>
  <text x="880" y="377" text-anchor="middle" font-size="10.5" fill="#78716C" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Prepend § 0 post-generation  ·  LLM never sees it</text>
  <text x="880" y="393" text-anchor="middle" font-size="10" fill="#57534E" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">All 7 item scores preserved verbatim every run</text>

  <line x1="880" y1="406" x2="880" y2="432" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="874,429 880,440 886,429" fill="#334155"/>

  <rect x="736" y="440" width="288" height="56" rx="8" fill="#0D2137" stroke="#0EA5E9" stroke-width="1.5"/>
  <text x="880" y="463" text-anchor="middle" font-size="12" font-weight="700" fill="#38BDF8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Screening Support Report</text>
  <text x="880" y="480" text-anchor="middle" font-size="10.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">GAD-7 § 0  ·  Findings §§ 1–4  ·  Referral § 7–8</text>
  <text x="880" y="491" text-anchor="middle" font-size="9.5" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">low / moderate / urgent  ·  non-diagnostic</text>

  <!-- CROSS-CUTTING BARS -->
  <rect x="28" y="460" width="696" height="38" rx="7" fill="#131C2B" stroke="#1E40AF" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="46" y="477" font-size="10" font-weight="700" fill="#3B82F6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">SESSION STORE (in-memory · keyed by sessionId)</text>
  <text x="46" y="491" font-size="10" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Threads userText · emotionAnalysis · symptomAnalysis · contextAnalysis · referralAnalysis · buildClaimsOutput · retrievalOutput · gad7Block across all steps</text>

  <rect x="28" y="508" width="696" height="32" rx="7" fill="#131C2B" stroke="#1E3A5F" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="46" y="526" font-size="10" font-weight="700" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">EVALUATION EXPORT  →  evaluation/prompt-experiments/runs/&lt;timestamp&gt;-cot-oneshot-v1-&lt;testcase&gt;.md  (auto-generated every run)</text>

  <!-- LEGEND -->
  <rect x="28" y="556" width="1224" height="44" rx="8" fill="#1E293B"/>
  <rect x="48" y="569" width="12" height="12" rx="2" fill="#1E3A5F" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="66" y="580" font-size="11" fill="#64748B" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">LLM agent</text>
  <rect x="160" y="569" width="12" height="12" rx="2" fill="#2D1B69" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="178" y="580" font-size="11" fill="#64748B" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Deterministic step</text>
  <rect x="298" y="569" width="12" height="12" rx="2" fill="#1A1A2E" stroke="#F97316" stroke-width="1.5"/>
  <text x="316" y="580" font-size="11" fill="#64748B" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Vector retrieval</text>
  <rect x="428" y="569" width="12" height="12" rx="2" fill="#1F0707" stroke="#F87171" stroke-width="1.5"/>
  <text x="446" y="580" font-size="11" fill="#64748B" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Validation / safety</text>
  <rect x="574" y="569" width="12" height="12" rx="2" fill="#1C1506" stroke="#FBBF24" stroke-width="1.5"/>
  <text x="592" y="580" font-size="11" fill="#64748B" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Post-LLM injection</text>
  <line x1="720" y1="575" x2="750" y2="575" stroke="#334155" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="758" y="580" font-size="11" fill="#64748B" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Data flow</text>
  <text x="860" y="580" font-size="11" fill="#64748B" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Mastra SDK  ·  TypeScript  ·  fastembed  ·  LibSQL  ·  Ollama  ·  Mistral 7B  ·  CoT + one-shot prompting</text>

  <!-- FOOTER -->
  <text x="640" y="630" text-anchor="middle" font-size="11" fill="#1E293B" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Privacy: 100% local — no data leaves the device  ·  EECS 4080  ·  Aya El-Dassouki  ·  York University  ·  2026</text>
</svg>
